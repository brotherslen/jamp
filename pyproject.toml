[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# "jamp" itself is taken on PyPI by an unrelated project; the command and the
# package are still jamp.
name = "jamp-archive"
version = "0.2.0b4"
description = "JAMP: an asset management pipeline for the live music archive"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mutagen>=1.47",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jamp = "jamp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["jamp"]

# The shipped config travels inside the package, so an installed copy finds it.
[tool.setuptools.package-data]
jamp = ["data/*.yaml", "data/examples/*.yaml", "data/templates/*.yaml"]
