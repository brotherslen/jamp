# Canonical taper slugs.  Provenance is part of the folder name, so a taper
# gets exactly one spelling: their online handle, or their surname.  The key is
# what gets written; the list is every raw string that should map to it.
# Anything not listed falls back to the surname/handle heuristic and is flagged
# in the report so you can add it here.
tapers:
  miller: ["Charlie Miller", "charliemiller", "cmiller", "charlie miller/ dat"]
  padelimike: ["PADeliMike", "PADelimike", "padeli mike"]
  vwmule: ["VWMULE", "vw mule"]
  zman: ["Z-Man", "the zman"]
  ldl: ["LDL"]
  leary: ["Leary"]

# Where to look a show up by hand when the library cannot settle it.  These are
# printed next to undated and low-confidence folders in the reports; nothing in
# the pipeline goes near the network.
references:
  default: "https://archive.org/"
  # Studio and compilation releases are not on the setlist sites; Discogs is
  # where a release name and year get confirmed.
  albums: "https://www.discogs.com/"
  bands:
    ph: "https://phish.net/"
    um: "https://allthings.umphreys.com"
    mmj: "https://archive.mymorningjacket.net/"
    gd: "https://jerrybase.com/"
    jgb: "https://jerrybase.com/"
    jgms: "https://jerrybase.com/"
    jgdg: "https://jerrybase.com/"
    jgjk: "https://jerrybase.com/"
    lom: "https://jerrybase.com/"
    kglw: "https://kglw.net/"

# --- provenance ------------------------------------------------------------
# Stores / labels / official channels.  `source` is the source we are allowed to
# INFER when no explicit source evidence exists.  Every inference is logged and
# stamped into a SOURCE_CONFIDENCE tag.
provenance:
  nugs:
    aliases: [nugs, "nugs.net", nugsnet]
    source: sbd
    official: true
  livephish:
    aliases: [livephish, "livephish.com", "live phish"]
    source: sbd
    official: true
  deadnet:
    aliases: ["dead.net", deadnet, "grateful dead productions"]
    source: sbd
    official: true
  umlive:
    aliases: [umlive, "umlive.net", "um live"]
    source: sbd
    official: true
  bandcamp:
    aliases: [bandcamp]
    source: sbd
    official: true
  # NB: archive.org and etree.org are deliberately absent.  They are where a
  # copy was distributed, not whose copy it is, and putting "archive" in a
  # folder name says nothing useful.  With no taper, the field is left out.

# Official release series. Matching one of these is a strong OFFICIAL signal.
# `multi_date: true` means the release spans several shows - reported, never renamed.
official_series:
  - name: "Dave's Picks"
    band: gd
    patterns: ["dave's picks", "daves picks"]
    release_id: "dp{n}"
    multi_date: true
  - name: "Dick's Picks"
    band: gd
    patterns: ["dick's picks", "dicks picks"]
    release_id: "dp{n}"
    multi_date: true
  - name: "Road Trips"
    band: gd
    patterns: ["road trips"]
    multi_date: true
  - name: "Download Series"
    band: gd
    patterns: ["download series"]
    multi_date: false
  - name: "Pure Jerry"
    band: jgb
    patterns: ["pure jerry"]
    multi_date: true
  - name: "Spring 1990"
    band: gd
    patterns: ["spring 1990", "spring 90"]
    multi_date: true
  # Box sets that hold one folder per night.  Listed so that being a release
  # is a stated fact rather than a guess from shape: without these, "holds
  # several shows" was the only test, and a taper's two-night bundle looked
  # exactly like Europe '72.
  - name: "30 Trips Around The Sun"
    band: gd
    patterns: ["30 trips around the sun", "thirty trips around the sun"]
    multi_date: true
  - name: "Europe '72 Complete Recordings"
    band: gd
    patterns: ["europe '72", "europe 72"]
    multi_date: true
  - name: "May 1977"
    band: gd
    patterns: ["may 1977"]
    multi_date: true
  - name: "July 1978"
    band: gd
    patterns: ["july 1978"]
    multi_date: true
  - name: "June 1976"
    band: gd
    patterns: ["june 1976"]
    multi_date: true
  - name: "Winterland 1973"
    band: gd
    patterns: ["winterland 1973"]
    multi_date: true
  - name: "Pacific Northwest '73-'74"
    band: gd
    patterns: ["pacific northwest '73-'74", "pacific northwest 73-74",
               "pacific northwest '73"]
    multi_date: true
  - name: "Here Comes Sunshine"
    band: gd
    patterns: ["here comes sunshine"]
    multi_date: true
  - name: "In and Out of the Garden"
    band: gd
    patterns: ["in and out of the garden"]
    multi_date: true
  - name: "Without a Net"
    band: gd
    patterns: ["without a net"]
    multi_date: true
  - name: "Winterland"
    band: gd
    patterns: ["winterland june", "winterland 1973"]
    multi_date: true

# Tokens that suggest the folder is not a concert at all.
non_show_tokens:
  - itunes session
  - rsd
  - record store day
  - single
  - " ep"
  - "(ep)"
  - demo
  - studio
  - soundtrack
  - compilation
  - greatest hits
  - b-sides
  - promo

# Folder-name suffixes that describe the audio format rather than the show.
format_suffixes:
  - shnf
  - shn
  - m4a
  - wma
  - flacf
  - flac
  - flac16
  - flac24
  - flac1644
  - flac2496
  - flac2448
  - flac16bit
  - flac24bit
  - mp3
  - v0
  - v2
  - "320"
  - m4a

# Bracketed quality tokens seen in official / store folder names.
quality_tokens:
  flac24: ["flac24", "flac-24", "flac 24", "24bit", "2496", "2448"]
  flac16: ["flac16", "flac-16", "flac 16", "1644"]
  mp3: ["v0", "v2", "320", "mp3"]

us_states: [AL, AK, AZ, AR, CA, CO, CT, DE, FL, GA, HI, ID, IL, IN, IA, KS, KY,
            LA, ME, MD, MA, MI, MN, MS, MO, MT, NE, NV, NH, NJ, NM, NY, NC, ND,
            OH, OK, OR, PA, RI, SC, SD, TN, TX, UT, VT, VA, WA, WV, WI, WY, DC]
