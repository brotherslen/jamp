  # AKG C-series, as tapers actually write it: "AKG C414", "AKGC414", "c414".
  - akg414
  - akg-414
  - akgc414
  # Schoeps CCM 4V, on both Phil & Friends 2012 nights and on
  # um2012-04-13.ccm4v.zman - the same taper, the same rig.
  - ccm4v
  - ccm-4v
