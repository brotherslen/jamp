# Venues: the rooms this library knows, and the ways they get written.
#
# This exists because the same room is spelled several ways - Alpine
# Valley Music Theater and Music Theatre, Riverport Amphitheater and
# Amphitheatre, RFK Stadium and Robert F. Kennedy Stadium - and because
# a folder often names a room without naming its city, which the
# City, ST guard then rejects, losing the venue entirely.
#
# A name here is NOT assumed unique. There is an Orpheum Theatre in
# Boston and another in San Francisco. A lookup that cannot tell which
# room is meant declines rather than guessing - see jamp/venues.py.
#
# Seeded by tools/build_gazetteer.py from the settled library and from
# the places stated by hand in overrides.yaml; maintained here after.

